apiVersion: v1
kind: Service
metadata:
  name: identity
  labels:
    app.kubernetes.io/name: identity
    app.kubernetes.io/part-of: chatfusion
spec:
  selector:
    app.kubernetes.io/name: identity
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity
  labels:
    app.kubernetes.io/name: identity
    app.kubernetes.io/part-of: chatfusion
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: identity
  template:
    metadata:
      labels:
        app.kubernetes.io/name: identity
        app.kubernetes.io/part-of: chatfusion
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: chatfusion/identity-migrator:0.1.0
          imagePullPolicy: IfNotPresent
          args: ["migrate"]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: ConnectionStrings__Identity
              value: "Host=postgres;Port=5432;Database=chatfusion_identity;Username=identity;Password=$(POSTGRES_PASSWORD);Gss Encryption Mode=Disable"
            - name: Admin__Email
              valueFrom:
                secretKeyRef:
                  name: identity-admin
                  key: email
            - name: Admin__PasswordFile
              value: /run/secrets/admin/password
          volumeMounts:
            - name: admin
              mountPath: /run/secrets/admin
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: identity
          image: chatfusion/identity:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_HTTP_PORTS
              value: "8080"
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: ConnectionStrings__Identity
              value: "Host=postgres;Port=5432;Database=chatfusion_identity;Username=identity;Password=$(POSTGRES_PASSWORD);Gss Encryption Mode=Disable"
            - name: Jwt__Issuer
              value: "http://localhost:5080"
            - name: Jwt__Audience
              value: chatfusion-api
            - name: Jwt__SigningKeyPath
              value: /run/secrets/signing/signing-key.pem
            - name: Cookies__Secure
              value: "true"
            - name: Scalar__Enabled
              value: "false"
          volumeMounts:
            - name: signing-key
              mountPath: /run/secrets/signing
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: signing-key
          secret:
            secretName: identity-signing-key
        - name: admin
          secret:
            secretName: identity-admin
